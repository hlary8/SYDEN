version: '3.8'

networks:
  DELEON ENTERPRiSES-network:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app:delegated
      - /app/node_modules
    env_file: .env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI
      - JWT_SECRET
      - JWT_REFRESH_SECRET
      - JWT_EXPIRE=15m
      - JWT_REFRESH_EXPIRE=7d
      - CLOUDINARY_CLOUD_NAME
      - CLOUDINARY_API_KEY
      - CLOUDINARY_API_SECRET
      - CLIENT_URL=http://localhost:5173
    ports:
      - "5000:5000"
    networks:
      - DELEON ENTERPRiSES-network

  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
      - VITE_CLOUDINARY_CLOUD_NAME
      - VITE_MAPBOX_TOKEN
    ports:
      - "5173:5173"
    networks:
      - DELEON ENTERPRiSES-network

