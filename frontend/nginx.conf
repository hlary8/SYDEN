server {
  listen       80;
  server_name  _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 256;

  # Cache static assets for 1 year
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2|woff|ttf)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri $uri/ /index.html;
  }

  # SEO: robots.txt and sitemap.xml via backend
  location ~ ^/(robots\.txt|sitemap\.xml)$ {
    proxy_pass http://backend:5000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # React router fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to backend when running docker-compose (service name: backend)
  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Disable access logs for cleanliness
  access_log off;
  error_log /var/log/nginx/error.log warn;
}
