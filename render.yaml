services:
  - type: web
    name: deleon-enterprises-api
    env: docker
    plan: starter
    dockerfilePath: backend/Dockerfile
    rootDir: backend
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generate: true
      - key: JWT_ACCESS_SECRET
        generate: true
      - key: JWT_REFRESH_SECRET
        generate: true
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: CLIENT_URL
        value: https://deleon-enterprises-web.onrender.com
      - key: CORS_ORIGIN
        value: https://deleon-enterprises-web.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: deleon-enterprises-web
    env: docker
    plan: starter
    dockerfilePath: frontend/Dockerfile
    rootDir: frontend
    autoDeploy: true
    envVars:
      - key: VITE_SITE_URL
        value: https://deleon1.onrender.com
      - key: VITE_API_URL
        value: https://deleon-enterprises-api.onrender.com/api/v1
      - key: BACKEND_URL
        value: https://deleon-enterprises-api.onrender.com
